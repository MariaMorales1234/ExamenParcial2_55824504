<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gestión de Items</title>

        <!-- ---- PWA: manifiesto + apariencia en móvil ---- -->
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="theme-color" content="#4f46e5" />
        <link rel="icon" href="/icons/icon-192.png" />
        <link rel="apple-touch-icon" href="/icons/icon-192.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="description"
            content="CRUD de items instalable, hecho con Express y Tailwind."
        />

        <!-- CSS generado por Tailwind (npm run dev / npm run build) -->
        <link rel="stylesheet" href="/css/styles.css" />
    </head>
    <body class="min-h-screen bg-surface text-ink antialiased">
        <!-- ============ NAVBAR ============ -->
        <nav class="border-b border-slate-200 bg-white">
            <div class="mx-auto flex max-w-4xl items-center gap-4 px-4 py-3">
                <span class="flex items-center gap-2 font-semibold">
                    <img src="/icons/icon-192.png" alt="" class="h-7 w-7 rounded-md" />
                    TDM
                </span>

                <ul class="flex items-center gap-1 text-sm">
                    <li>
                        <a
                            href="/index.html"
                            class="rounded-lg bg-brand-50 px-3 py-1.5 font-medium text-brand-700"
                            >Gestión</a
                        >
                    </li>
                    <li>
                        <a
                            href="/catalogo.html"
                            class="rounded-lg px-3 py-1.5 text-slate-600 hover:bg-slate-100"
                            >Catálogo</a
                        >
                    </li>
                </ul>

                <div class="ml-auto flex items-center gap-2">
                    <!-- Se muestra solo cuando el navegador queda sin conexión -->
                    <span
                        id="offlineBadge"
                        hidden
                        class="rounded-full bg-amber-100 px-2.5 py-1 text-xs font-medium text-amber-800"
                    >
                        Sin conexión
                    </span>
                    <!-- Se muestra solo cuando la app se puede instalar -->
                    <button id="installBtn" hidden class="btn btn-ghost !py-1.5 text-xs">
                        Instalar app
                    </button>
                </div>
            </div>
        </nav>

        <main class="mx-auto max-w-4xl px-4 py-8">
            <header class="mb-6">
                <h1 class="text-2xl font-bold tracking-tight">Gestión de Items</h1>
                <p class="mt-1 text-sm text-slate-500">Crea, edita y elimina items del catálogo.</p>
            </header>

            <!-- ============ FORMULARIO ============ -->
            <form
                id="itemForm"
                class="mb-8 rounded-card border border-slate-200 bg-white p-4 shadow-sm"
            >
                <div class="grid gap-3 sm:grid-cols-[1fr_1fr_auto]">
                    <div>
                        <label for="name" class="mb-1 block text-xs font-medium text-slate-600"
                            >Nombre</label
                        >
                        <input
                            type="text"
                            id="name"
                            class="input"
                            placeholder="Nombre del item"
                            required
                        />
                    </div>
                    <div>
                        <label
                            for="description"
                            class="mb-1 block text-xs font-medium text-slate-600"
                            >Descripción</label
                        >
                        <input
                            type="text"
                            id="description"
                            class="input"
                            placeholder="Descripción (opcional)"
                        />
                    </div>
                    <div class="flex items-end gap-2">
                        <button type="submit" id="submitBtn" class="btn btn-primary">
                            Agregar
                        </button>
                        <button type="button" id="cancelBtn" hidden class="btn btn-ghost">
                            Cancelar
                        </button>
                    </div>
                </div>
            </form>

            <!-- ============ TABLA ============ -->
            <div class="overflow-hidden rounded-card border border-slate-200 bg-white shadow-sm">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
                        <tr>
                            <th class="px-4 py-3 font-medium">ID</th>
                            <th class="px-4 py-3 font-medium">Nombre</th>
                            <th class="px-4 py-3 font-medium">Descripción</th>
                            <th class="px-4 py-3 text-right font-medium">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="itemsTable" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </main>

        <script type="module" src="/js/main.js"></script>
        <script type="module" src="/js/pwa.js"></script>
    </body>
</html>
