<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Catálogo de Items</title>

        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="theme-color" content="#4f46e5" />
        <link rel="icon" href="/icons/icon-192.png" />
        <link rel="apple-touch-icon" href="/icons/icon-192.png" />

        <link rel="stylesheet" href="/css/styles.css" />
    </head>
    <body class="min-h-screen bg-surface text-ink antialiased">
        <nav class="border-b border-slate-200 bg-white">
            <div class="mx-auto flex max-w-4xl items-center gap-4 px-4 py-3">
                <span class="flex items-center gap-2 font-semibold">
                    <img src="/icons/icon-192.png" alt="" class="h-7 w-7 rounded-md" />
                    TDM
                </span>

                <ul class="flex items-center gap-1 text-sm">
                    <li>
                        <a
                            href="/index.html"
                            class="rounded-lg px-3 py-1.5 text-slate-600 hover:bg-slate-100"
                            >Gestión</a
                        >
                    </li>
                    <li>
                        <a
                            href="/catalogo.html"
                            class="rounded-lg bg-brand-50 px-3 py-1.5 font-medium text-brand-700"
                            >Catálogo</a
                        >
                    </li>
                </ul>

                <div class="ml-auto flex items-center gap-2">
                    <span
                        id="offlineBadge"
                        hidden
                        class="rounded-full bg-amber-100 px-2.5 py-1 text-xs font-medium text-amber-800"
                    >
                        Sin conexión
                    </span>
                    <button id="installBtn" hidden class="btn btn-ghost !py-1.5 text-xs">
                        Instalar app
                    </button>
                </div>
            </div>
        </nav>

        <main class="mx-auto max-w-4xl px-4 py-8">
            <header class="mb-6">
                <h1 class="text-2xl font-bold tracking-tight">Catálogo de Items</h1>
                <p class="mt-1 text-sm text-slate-500">
                    Vista pública de solo lectura. <strong>Pendiente:</strong> completar los TODO de
                    <code class="rounded bg-slate-100 px-1 py-0.5 text-xs">js/catalog.js</code>.
                </p>
            </header>

            <!-- Aquí se van a renderizar las tarjetas con los items -->
            <div id="catalogContainer" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
        </main>

        <script type="module" src="/js/catalog.js"></script>
        <script type="module" src="/js/pwa.js"></script>
    </body>
</html>
